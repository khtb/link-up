<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gPTP Automotive Course</title>
  <!-- Fonts are optional: without internet the course falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = (JSON.parse(localStorage.getItem('gptp-course-v1')) || {}).theme; if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Toggle lesson menu">☰</button>
    <a class="icon-btn" href="../" title="All courses" aria-label="All courses" style="display:inline-grid;place-items:center;text-decoration:none">⌂</a>
    <div class="brand"><span class="logo">⏱</span>gPTP (IEEE 802.1AS) <span class="muted">· timestamping, bridges &amp; automotive</span></div>
    <div class="progress-wrap" title="Course progress">
      <div class="progress"><div id="progressBar"></div></div>
      <span id="progressText">0%</span>
    </div>
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <button type="button" data-theme-set="light" aria-pressed="false">☀ Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">☾ Dark</button>
      <button type="button" data-theme-set="auto" aria-pressed="false">Auto</button>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Lessons"></nav>
    <main id="content" class="content" tabindex="-1"></main>
  </div>

  <!-- Core -->
  <script src="assets/js/ptpmath.js"></script>
  <script src="assets/js/engine.js"></script>
  <!-- Lessons (order here = order in the course) -->
  <script src="assets/js/lessons/01-intro.js"></script>
  <script src="assets/js/lessons/02-basics.js"></script>
  <script src="assets/js/lessons/03-messages.js"></script>
  <script src="assets/js/lessons/04-timestamping.js"></script>
  <script src="assets/js/lessons/05-hw-capabilities.js"></script>
  <script src="assets/js/lessons/06-pdelay.js"></script>
  <script src="assets/js/lessons/07-switch-anatomy.js"></script>
  <script src="assets/js/lessons/08-bridge-modes.js"></script>
  <script src="assets/js/lessons/09-bmca.js"></script>
  <script src="assets/js/lessons/10-auto-profile.js"></script>
  <script src="assets/js/lessons/11-as2011-vs-2020.js"></script>
  <script src="assets/js/lessons/12-auto-ecosystem.js"></script>
  <script src="assets/js/lessons/13-linux.js"></script>
  <script src="assets/js/lessons/14-quiz.js"></script>
  <script src="assets/js/lessons/15-glossary.js"></script>
  <script>Course.start();</script>
</body>
</html>
